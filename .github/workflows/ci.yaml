name: foundations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: forge_owner
          POSTGRES_PASSWORD: forge-owner-dev-only
          POSTGRES_DB: forge
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forge_owner -d forge"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://forge_owner:forge-owner-dev-only@localhost:5432/forge?sslmode=disable
      TEST_DATABASE_URL: postgres://forge_app:forge-dev-only@localhost:5432/forge?sslmode=disable
      BUF_BREAKING_AGAINST: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.34.5'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: make tools web-install generate
      - name: Generated clients are committed and current
        run: |
          git diff --exit-code -- gen web/src/gen
          test -z "$(git ls-files --others --exclude-standard gen web/src/gen)"
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/compose/init.sql
      - name: Migrations up, down, up
        run: |
          make migrate
          go run ./cmd/migrate down
          make migrate
      - run: make lint test integration build breaking
      - name: Business logic coverage
        run: python3 scripts/check-coverage.py coverage.out
      - run: .tools/govulncheck ./...
      - run: pnpm --dir web audit --prod --audit-level high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dev
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color
      - name: Image scan (server)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          version: v0.76.0
          image-ref: forge-server:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Image scan (web)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          version: v0.76.0
          image-ref: forge-web:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
      - if: always()
        run: make down
