syntax = "proto3";

package forge.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cavula/forge/gen/go/forge/v1;forgev1";

// Org is the tenant security boundary. Identifiers are canonical UUID strings.
message Org {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}
